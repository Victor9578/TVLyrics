name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # runner 自带 Android SDK，补装 compileSdk 37.1（已装则跳过）
      - name: Ensure Android platform 37.1
        run: yes 2>/dev/null | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "build-tools;34.0.0" >/dev/null || true

      - name: Install Gradle 9.8.2
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-9.8.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-9.8.2/bin" >> "$GITHUB_PATH"

      - name: Build release APK（debug 签名，可直接覆盖安装）
        run: gradle assembleRelease --no-daemon

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TVLyrics-v0.3.0
          path: app/build/outputs/apk/release/app-release.apk
